# Uploads this website to the cPanel hosting every time you push to "main".
# Needs 3 secrets in GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER    e.g. ftp.africakaiser.co.uk
#   FTP_USERNAME  your cPanel / FTP username
#   FTP_PASSWORD  its password
# The server's .env (passwords), data/ (database, RFQ files) and uploads/ (product photos) are never touched.

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you click "Run workflow" in the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the website files
        uses: actions/checkout@v4

      - name: Upload to the hosting (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .env
            .env.*
            data/**
            uploads/**
            **/*.map
